name: Deploy Shape Manifold Application to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Verify delivered source identity
        run: python verify_source.py

      - name: Run analytics tests
        run: python -m pytest tests/ -q

      - name: Check Python imports and names
        run: python -m pyflakes core scripts tests verify_source.py

      - name: Compile Python sources
        run: python -m compileall -q core scripts tests verify_source.py

      - name: Verify AME simulated-reference provenance and numerical contract
        run: python scripts/export_ame_references.py --check

      - name: Check and test JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/photo-warp.mjs
          node --test tests/test_*.mjs

      - name: Set up Node for experimental AME app
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install and validate AME capture app
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Verify built preview in installed Edge
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m pytest tests/test_browser.py -q
        env:
          MANIFOLD_BROWSER_TESTS: "1"
          MANIFOLD_TEST_BROWSER: msedge
          MANIFOLD_SCREENSHOT: tmp/pdfs/ame-edge.png

      - name: Preserve Edge rendering evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ame-edge-preview
          path: tmp/pdfs/ame-edge.png
          if-no-files-found: ignore

      - name: Rebuild and validate the 27-page report
        run: |
          python scripts/build_apa_report.py
          git diff --check
          git diff --exit-code -- docs/bio_social_aesthetic_manifold_apa_report.pdf
          python verify_source.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static web assets
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "."

      - name: Deploy application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
