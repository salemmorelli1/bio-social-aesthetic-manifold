name: Deploy Shape Manifold Application to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run analytics tests
        run: python -m pytest tests/ -q

      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/photo-warp.mjs

      - name: Rebuild and validate the 27-page report
        run: python scripts/build_apa_report.py

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static web assets
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
